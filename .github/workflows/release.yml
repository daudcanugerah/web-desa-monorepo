name: Release

# Push a semver-tagged release to build and publish a container image to GHCR:
#
#   git tag release/api/v1.2.3   && git push origin release/api/v1.2.3
#   git tag release/admin/v1.2.3 && git push origin release/admin/v1.2.3
#   git tag release/web/v1.2.3   && git push origin release/web/v1.2.3
#
# Images (same repo/package, one name per component):
#   ghcr.io/<owner>/<repo>/api:1.2.3   (+ 1.2, latest)
#   ghcr.io/<owner>/<repo>/admin:1.2.3 (+ 1.2, latest)
#   ghcr.io/<owner>/<repo>/web:1.2.3   (+ 1.2, latest)
#
# Auth: secret API_KEY (PAT with `write:packages`), falling back to the
# workflow token when the secret is unset.

on:
  push:
    tags:
      - 'release/api/v*'
      - 'release/admin/v*'
      - 'release/web/v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Parse release tag
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      image: ${{ steps.parse.outputs.image }}
    steps:
      - name: Parse release tag
        id: parse
        run: |
          set -euo pipefail

          ref="$GITHUB_REF_NAME"
          component="${ref#release/}"
          component="${component%%/*}"
          version="${ref##*/}"

          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$ref' is not semver (expected release/<component>/vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          case "$component" in
            api|admin|web) ;;
            *) echo "::error::Unknown component '$component'"; exit 1 ;;
          esac

          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/${component}"
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          {
            echo "### Release: $component $version"
            echo ""
            echo "- Image: \`$image\`"
            echo "- Trigger: \`$ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

  api:
    name: Build & push api
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.component == 'api'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.API_KEY || github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  admin:
    name: Build & push admin
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.component == 'admin'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.API_KEY || github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.desapalasari.my.id' }}
            VITE_METABASE_URL=${{ vars.VITE_METABASE_URL || 'https://bi-embed.desapalasari.my.id' }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  web:
    name: Build & push web
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.component == 'web'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.API_KEY || github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.desapalasari.my.id/api/v1' }}
            VITE_METABASE_URL=${{ vars.VITE_METABASE_URL || 'https://bi-embed.desapalasari.my.id' }}
            VITE_FEATURE_GALLERY_PUBLIC=${{ vars.VITE_FEATURE_GALLERY_PUBLIC || 'true' }}
            VITE_FEATURE_BERITA_SEARCH=${{ vars.VITE_FEATURE_BERITA_SEARCH || 'false' }}
            VITE_FEATURE_INFOGRAPHIC_SORT=${{ vars.VITE_FEATURE_INFOGRAPHIC_SORT || 'false' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
