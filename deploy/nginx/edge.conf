# Edge reverse proxy for webdesa.
# Routes each hostname to its container. Add TLS server blocks (or run this
# behind a TLS terminator such as certbot/Cloudflare) for production HTTPS.

upstream web_up   { server web:80; }
upstream admin_up { server admin:80; }
upstream api_up   { server api:8080; }

# --- Public site: desapalasari.my.id ---
server {
    listen 80;
    server_name desapalasari.my.id www.desapalasari.my.id;

    location / {
        proxy_pass http://web_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Admin dashboard: admin.desapalasari.my.id ---
server {
    listen 80;
    server_name admin.desapalasari.my.id;

    location / {
        proxy_pass http://admin_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- REST API: api.desapalasari.my.id ---
server {
    listen 80;
    server_name api.desapalasari.my.id;

    # Allow large media uploads through the proxy (API enforces its own caps).
    client_max_body_size 110m;

    location / {
        proxy_pass http://api_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamed media responses
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
