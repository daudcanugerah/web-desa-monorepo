# Staging Environment Configuration

[app]
name = "desa-api"
version = "1.0.0"
http_addr = ":8080"
timezone = "Asia/Jakarta"
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "120s"

[postgres]
dsn = "postgres://desa_user:desa_pass@postgres:5432/desa_staging?sslmode=require"
max_open_conns = 25
max_idle_conns = 5
conn_max_lifetime = "5m"

[jwt]
secret = "staging-secret-key-change-this-in-production"
expiration = "24h"

[backup]
directory = "/var/backups/desa-api"

[cors]
allowed_origins = ["https://staging.desa.example.com"]

[ratelimit]
auth_requests_per_minute = 5
public_requests_per_minute = 100
protected_requests_per_minute = 30

[fileupload]
max_image_size_mb = 10
max_document_size_mb = 50
upload_public_directory = "/var/uploads/desa-api/public"
upload_private_directory = "/var/uploads/desa-api/private"

[gallery]
thumbnail_max_width = 400
thumbnail_max_height = 400
thumbnail_quality = 80
image_max_size_mb = 10
video_max_size_mb = 100
bulk_upload_max_files = 20
bulk_upload_max_total_mb = 250
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
video_thumbnail_frame_seconds = 1

[smtp]
host = "smtp.gmail.com"
port = 587
username = ""
password = ""
from_name = "Village Administration"
from_email = ""

[otel]
metric = true
trace = true
log = true

[debug]
profiler_addr = ""
