version: '3.8'

services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: desa-api-swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /swagger/swagger.yaml
      BASE_URL: /swagger
    volumes:
      - ./docs/swagger.yaml:/swagger/swagger.yaml:ro
    networks:
      - desa-network

networks:
  desa-network:
    external: true