# Redocly CLI configuration for the generated OpenAPI spec.
#
# The spec is auto-generated by `swag init` from Go source annotations
# (see Makefile target `swagger-gen`). It is not hand-written, so we relax
# rules that would force us to maintain handcrafted metadata:
#
#   - operation-summary        : some endpoints inherit @Router but lack @Summary
#                                due to nested swag annotation edge cases
#   - path-parameters-defined  : same root cause
#   - security-defined         : public endpoints legitimately have no @Security
#   - operation-operationId    : swag doesn't emit operationId; auto-generated
#                                from method+path is acceptable
#   - operation-4xx-response   : informational; 4xx responses covered elsewhere
#   - info-license            : license is internal, not externally documented
#
# Critical correctness rules (spec MUST be valid OpenAPI 2.0/3.0) are still enforced
# via the `recommended` ruleset.
extends:
  - recommended

rules:
  operation-summary: off
  path-parameters-defined: off
  security-defined: off
  operation-operationId: off
  operation-4xx-response: warn
  info-license: off
  no-path-trailing-slash: error
  path-not-include-query: error
  spec-components-invalid-map-name: error
  no-unused-components: error

# Tabs/spaces for nicer diffs
formatter: {}