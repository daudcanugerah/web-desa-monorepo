host: localhost:8080
info:
    contact: {}
    description: REST API for the Desa (village) information system. Implements Clean Architecture with strict dependency rules, JWT (HS256) authentication, Casbin RBAC, PostgreSQL persistence, and rate limiting.
    title: Desa API
    version: "1.0"
paths:
    /api/v1/health:
        get:
            description: Versioned alias for /health. Returns 200 OK if the service is alive. No authentication required.
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/response.HealthResponse'
            summary: Health check (v1 alias)
            tags:
                - health
    /auth/login:
        post:
            consumes:
                - application/json
            description: Authenticate with email + password and receive JWT access (24h) + refresh (7d) tokens.
            parameters:
                - description: Login credentials
                  in: body
                  name: request
                  required: true
                  schema:
                    additionalProperties: true
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/auth.LoginResponse'
                "400":
                    description: Invalid request body
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
                "401":
                    description: Invalid credentials
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
                "429":
                    description: Rate limit exceeded
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
            summary: User login
            tags:
                - auth
    /auth/password-reset/check:
        get:
            description: Return whether the reset token is still valid and its expiry.
            parameters:
                - description: Reset token
                  in: query
                  name: token
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/auth.PasswordResetCheckResponse'
                "400":
                    description: Token missing
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
            summary: Validate password reset token
            tags:
                - auth
    /auth/password-reset/confirm:
        post:
            consumes:
                - application/json
            description: Apply a new password using a valid reset token.
            parameters:
                - description: Reset token + new password
                  in: body
                  name: request
                  required: true
                  schema:
                    additionalProperties: true
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    description: Password reset
                    schema:
                        $ref: '#/definitions/auth.MessageResponse'
                "400":
                    description: Invalid or expired token
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
            summary: Confirm password reset
            tags:
                - auth
    /auth/password-reset/request:
        post:
            consumes:
                - application/json
            description: Initiate the password-reset flow for the given email. Rate-limited to 5 requests per hour per email.
            parameters:
                - description: Email address
                  in: body
                  name: request
                  required: true
                  schema:
                    additionalProperties: true
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    description: Reset link sent (if email exists)
                    schema:
                        $ref: '#/definitions/auth.MessageResponse'
                "400":
                    description: Invalid request body
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
                "429":
                    description: Too many reset requests
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
            summary: Request password reset
            tags:
                - auth
    /auth/refresh:
        post:
            consumes:
                - application/json
            description: Exchange a valid refresh token for a new access token (24h).
            parameters:
                - description: Refresh token
                  in: body
                  name: request
                  required: true
                  schema:
                    additionalProperties: true
                    type: object
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/auth.RefreshTokenResponse'
                "400":
                    description: Invalid request body
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
                "401":
                    description: Invalid or expired refresh token
                    schema:
                        $ref: '#/definitions/response.ErrorResponse'
            summary: Refresh access token
            tags:
                - auth
    /banners:
        get:
            description: 'Paginated list of banners, optionally filtered by status, q (title/description), or category. RBAC: banners:read.'
            parameters:
                - default: 1
                  description: Page number
                  in: query
                  name: page
                  type: integer
                - default: 10
                  description: Page size
                  in: query
                  name: limit
                  type: integer
                - description: Filter by status
                  enum:
                    - active
                    - inactive
                  in: query
