# Web (public site) — desapalasari.my.id
server {
    listen 80;
    server_name desapalasari.my.id www.desapalasari.my.id;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Hashed build assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the SPA shell
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback — all routes render index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
