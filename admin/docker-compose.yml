# Admin dashboard — standalone stack.
#
#   docker compose up -d --build                        # build from ./Dockerfile
#   ADMIN_IMAGE=ghcr.io/<owner>/<repo>/admin:1.2.3 \
#     docker compose up -d --no-build                   # run the published image
#
# VITE_* values are baked at build time. Copy .env.example to .env and adjust,
# or pass them inline. VITE_API_BASE_URL is the API origin only — the admin
# client appends /api/v1 itself.

services:
  admin:
    image: ${ADMIN_IMAGE:-desa-admin:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_METABASE_URL: ${VITE_METABASE_URL:-}
    container_name: desa-admin
    # Runtime config — injected into /env.js at container start. Overrides the
    # build-time ARG defaults without rebuilding the image.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.desapalasari.my.id}
      VITE_METABASE_URL: ${VITE_METABASE_URL:-https://bi-embed.desapalasari.my.id}
    ports:
      - "${ADMIN_PORT:-8083}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s