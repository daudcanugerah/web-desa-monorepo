# webdesa — production stack
#
#   desapalasari.my.id        -> web (public site)
#   admin.desapalasari.my.id  -> admin dashboard
#   api.desapalasari.my.id    -> Go REST API
#
# Usage:
#   docker compose up -d --build
#
# Prereqs: point the three DNS names at this host, and review api/config.toml
# (SMTP / Metabase values are read from the mounted config, not this file).

name: webdesa

services:
  postgres:
    image: postgres:16-alpine
    container_name: webdesa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-desauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desapass}
      POSTGRES_DB: ${POSTGRES_DB:-desa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desauser} -d ${POSTGRES_DB:-desa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webdesa
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: webdesa-api
    environment:
      APP_ENV: production
      APP_NAME: desa-api
      APP_VERSION: "1.0.0"
      APP_HTTP_ADDR: ":8080"
      APP_DOMAIN_ADDR: https://desapalasari.my.id
      APP_TIMEZONE: Asia/Jakarta
      POSTGRES_DSN: postgres://${POSTGRES_USER:-desauser}:${POSTGRES_PASSWORD:-desapass}@postgres:5432/${POSTGRES_DB:-desa}?sslmode=disable
      POSTGRES_MAX_OPEN_CONNS: "25"
      POSTGRES_MAX_IDLE_CONNS: "5"
      POSTGRES_CONN_MAX_LIFETIME: 5m
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRATION: 24h
      BACKUP_DIRECTORY: /app/backups
      CORS_ALLOWED_ORIGINS: >-
        https://desapalasari.my.id,https://www.desapalasari.my.id,https://admin.desapalasari.my.id
      RATELIMIT_AUTH_REQUESTS_PER_MINUTE: "5"
      RATELIMIT_PUBLIC_REQUESTS_PER_MINUTE: "100"
      RATELIMIT_PROTECTED_REQUESTS_PER_MINUTE: "30"
      FILEUPLOAD_MAX_IMAGE_SIZE_MB: "10"
      FILEUPLOAD_MAX_DOCUMENT_SIZE_MB: "50"
      FILEUPLOAD_UPLOAD_PUBLIC_DIRECTORY: /app/uploads/public
      FILEUPLOAD_UPLOAD_PRIVATE_DIRECTORY: /app/uploads/private
      FILEUPLOAD_UPLOAD_PPID_DIRECTORY: /app/uploads/ppid
      GALLERY_THUMBNAIL_MAX_WIDTH: "400"
      GALLERY_THUMBNAIL_MAX_HEIGHT: "400"
      GALLERY_THUMBNAIL_QUALITY: "80"
      GALLERY_IMAGE_MAX_SIZE_MB: "10"
      GALLERY_VIDEO_MAX_SIZE_MB: "100"
      GALLERY_BULK_UPLOAD_MAX_FILES: "20"
      GALLERY_BULK_UPLOAD_MAX_TOTAL_MB: "250"
      GALLERY_FFMPEG_PATH: ffmpeg
      GALLERY_FFPROBE_PATH: ffprobe
      GALLERY_VIDEO_THUMBNAIL_FRAME_SECONDS: "1"
      # Gallery switches to signed /api/v1/media/{id}/...?jwt= URLs.
      GALLERY_SIGNED_URLS_ENABLED: "true"
    volumes:
      # Settings that are not overridable via env (SMTP, Metabase secret, …).
      - ./api/config.toml:/app/config.toml:ro
      - ./api/uploads:/app/uploads
      - ./api/backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webdesa
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: https://api.desapalasari.my.id/api/v1
        VITE_METABASE_URL: ${VITE_METABASE_URL:-https://bi-embed.desapalasari.my.id}
        VITE_FEATURE_GALLERY_PUBLIC: "true"
        VITE_FEATURE_BERITA_SEARCH: "false"
        VITE_FEATURE_INFOGRAPHIC_SORT: "false"
    container_name: webdesa-web
    # Runtime config: injected into /env.js at start, overriding the build args
    # above without a rebuild. Override VITE_API_BASE_URL in .env to retarget.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.desapalasari.my.id/api/v1}
      VITE_METABASE_URL: ${VITE_METABASE_URL:-https://bi-embed.desapalasari.my.id}
      VITE_FEATURE_GALLERY_PUBLIC: ${VITE_FEATURE_GALLERY_PUBLIC:-true}
      VITE_FEATURE_BERITA_SEARCH: ${VITE_FEATURE_BERITA_SEARCH:-false}
      VITE_FEATURE_INFOGRAPHIC_SORT: ${VITE_FEATURE_INFOGRAPHIC_SORT:-false}
    depends_on:
      - api
    networks:
      - webdesa
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: https://api.desapalasari.my.id
        VITE_METABASE_URL: ${VITE_METABASE_URL:-https://bi-embed.desapalasari.my.id}
    container_name: webdesa-admin
    # Runtime config: injected into /env.js at start, overriding the build args
    # above without a rebuild. VITE_API_BASE_URL is the API origin (host only).
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL_ADMIN:-https://api.desapalasari.my.id}
      VITE_METABASE_URL: ${VITE_METABASE_URL:-https://bi-embed.desapalasari.my.id}
    depends_on:
      - api
    networks:
      - webdesa
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    container_name: webdesa-edge
    ports:
      - "80:80"
      # Terminate TLS here (mount certs) or behind Cloudflare / another proxy:
      # - "443:443"
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - admin
      - api
    networks:
      - webdesa
    restart: unless-stopped

networks:
  webdesa:
    driver: bridge

volumes:
  postgres_data:
    driver: local
